services:
  app:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /srv/data
    volumes:
      - ./data:/srv/data
      - ./knowledge:/srv/knowledge
    restart: always

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: always

volumes:
  caddy_data:
